<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ticket · Mis finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ticket">
<meta name="theme-color" content="#201E1B">
</head>
<body>

<!-- LOGIN -->
<div id="login" class="screen">
  <form id="login-form" class="login-card" autocomplete="on">
    <div class="mark">$</div>
    <h1>Ticket</h1>
    <p class="muted">Anotá cada gasto en segundos.</p>
    <input id="login-email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="login-pass" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Entrar</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
</div>

<!-- APP -->
<div id="app" class="screen hidden">
  <main>

    <!-- INICIO -->
    <section id="tab-inicio" class="tab">
      <div class="summary" id="home-summary"></div>
      <div id="home-alerts"></div>

      <form id="add-form" class="card" autocomplete="off">
        <div class="seg" id="type-seg" role="tablist">
          <button type="button" data-type="gasto" class="on">Gasto</button>
          <button type="button" data-type="ingreso">Ingreso</button>
          <button type="button" data-type="inversion">Inversión</button>
        </div>

        <div class="seg small hidden" id="dir-seg">
          <button type="button" data-dir="aporte" class="on">Aporto</button>
          <button type="button" data-dir="retiro">Retiro</button>
        </div>

        <div class="amount-row">
          <div class="seg small" id="cur-seg">
            <button type="button" data-cur="ARS" class="on">ARS</button>
            <button type="button" data-cur="USD">USD</button>
          </div>
          <input id="amount" type="text" inputmode="decimal" placeholder="0" aria-label="Monto">
        </div>

        <div class="chips" id="cat-chips"></div>

        <div class="row2">
          <select id="pay" aria-label="Forma de pago"></select>
          <input id="note" type="text" placeholder="Nota (opcional)" maxlength="80">
        </div>

        <button class="btn primary big" type="submit" id="add-btn">Guardar</button>
      </form>

      <h2>Hoy</h2>
      <div id="today-list" class="list"></div>
    </section>

    <!-- HISTORIAL -->
    <section id="tab-historial" class="tab hidden">
      <div class="month-nav">
        <button class="icon-btn" id="prev-month" aria-label="Mes anterior">‹</button>
        <strong id="month-label"></strong>
        <button class="icon-btn" id="next-month" aria-label="Mes siguiente">›</button>
      </div>
      <div class="summary" id="hist-summary"></div>
      <div id="invested-total" class="invested"></div>
      <div id="hist-list" class="list"></div>
    </section>

    <!-- DEUDAS -->
    <section id="tab-deudas" class="tab hidden">
      <div class="head-row"><h2>Deudas</h2><button class="btn small" id="toggle-debt-form">+ Nueva</button></div>
      <form id="debt-form" class="card hidden" autocomplete="off">
        <div class="seg" id="debt-type-seg">
          <button type="button" data-dt="debo" class="on">Debo</button>
          <button type="button" data-dt="medeben">Me deben</button>
        </div>
        <input id="debt-name" type="text" placeholder="Nombre (ej. Tarjeta Visa)" maxlength="60" required>
        <div class="amount-row">
          <div class="seg small" id="debt-cur-seg">
            <button type="button" data-cur="ARS" class="on">ARS</button>
            <button type="button" data-cur="USD">USD</button>
          </div>
          <input id="debt-amount" type="text" inputmode="decimal" placeholder="Monto total" required>
        </div>
        <button class="btn primary" type="submit">Guardar deuda</button>
      </form>
      <div id="debt-list" class="list"></div>
    </section>

    <!-- MÁS -->
    <section id="tab-inversiones" class="tab hidden">
      <h1>Inversiones</h1>
      <div id="inv-root"></div>
    </section>

    <section id="tab-mas" class="tab hidden">
      <h2>Presupuestos</h2>
      <p class="muted">Límite mensual en pesos por categoría de gasto. Vacío = sin límite.</p>
      <div id="budget-list" class="card list"></div>

      <div class="head-row"><h2>Recurrentes</h2><button class="btn small" id="toggle-rec-form">+ Nuevo</button></div>
      <form id="rec-form" class="card hidden" autocomplete="off">
        <div class="seg" id="rec-type-seg">
          <button type="button" data-type="gasto" class="on">Gasto</button>
          <button type="button" data-type="ingreso">Ingreso</button>
        </div>
        <input id="rec-name" type="text" placeholder="Nombre (ej. Alquiler)" maxlength="60" required>
        <div class="chips" id="rec-cat-chips"></div>
        <div class="amount-row">
          <div class="seg small" id="rec-cur-seg">
            <button type="button" data-cur="ARS" class="on">ARS</button>
            <button type="button" data-cur="USD">USD</button>
          </div>
          <input id="rec-amount" type="text" inputmode="decimal" placeholder="Monto" required>
        </div>
        <label class="inline">Día del mes (1–28)
          <input id="rec-day" type="number" min="1" max="28" value="1" required>
        </label>
        <button class="btn primary" type="submit">Guardar recurrente</button>
      </form>
      <div id="rec-list" class="card list"></div>

      <h2>Categorías</h2>
      <div class="seg small" id="catedit-seg">
        <button type="button" data-type="gasto" class="on">Gasto</button>
        <button type="button" data-type="ingreso">Ingreso</button>
        <button type="button" data-type="inversion">Inversión</button>
      </div>
      <div id="catedit-list" class="card list"></div>
      <form id="catedit-form" class="row2 add-inline">
        <input id="catedit-input" type="text" placeholder="Nueva categoría" maxlength="30">
        <button class="btn small" type="submit">Agregar</button>
      </form>

      <h2>Formas de pago</h2>
      <div id="payedit-list" class="card list"></div>
      <form id="payedit-form" class="row2 add-inline">
        <input id="payedit-input" type="text" placeholder="Nueva forma de pago" maxlength="30">
        <button class="btn small" type="submit">Agregar</button>
      </form>

      <div class="foot">
        <button class="btn ghost" id="logout-btn">Cerrar sesión</button>
      </div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="inicio" class="on"><span>＋</span>Cargar</button>
    <button data-tab="historial"><span>≡</span>Historial</button>
    <button data-tab="deudas"><span>⇄</span>Deudas</button>
    <button data-tab="inversiones"><span>↗</span>Inversión</button>
    <button data-tab="mas"><span>⋯</span>Más</button>
  </nav>
</div>

<div id="toast" class="toast hidden" role="status"></div>
<div id="errbox" class="errbox hidden"></div>

<script>
  // Si algo falla al cargar, mostrarlo en pantalla (sirve para sacarle foto y mandarla)
  (function () {
    var box = document.getElementById('errbox');
    function show(m) { box.textContent = 'Error: ' + m; box.classList.remove('hidden'); }
    window.addEventListener('error', function (e) { show(e.message); });
    window.addEventListener('unhandledrejection', function (e) {
      show((e.reason && e.reason.message) || e.reason);
    });
  })();
</script>
<script type="module" src="app.js"></script>
<script type="module" src="inversiones.js"></script>
</body>
</html>
